name: Daily FSA Hygiene Data Sync & Auto-Deploy

on:
  schedule:
    # Runs everyday at 03:00 UTC (When UK Food Standards Agency publishes new inspection feeds)
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Allows manual 1-click trigger from GitHub Actions tab

jobs:
  sync-and-deploy:
    name: Sync Official UK FSA Open Data
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Project Dependencies
        run: npm ci || npm install

      - name: 🚀 Run FSA ETL Sync Pipeline
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync:fsa

      - name: 🔍 Verify Next.js Production Build
        run: npm run build

      - name: 🌐 Trigger Auto-Deployment (Vercel / Hosting Webhook)
        if: env.VERCEL_DEPLOY_HOOK != ''
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          echo "Triggering live production deployment webhook..."
          curl -X POST "$VERCEL_DEPLOY_HOOK"
          echo "Deployment webhook triggered successfully."
