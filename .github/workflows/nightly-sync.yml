name: Nightly FSA Food Hygiene Delta Sync

on:
  schedule:
    # Runs every night at 04:00 UTC (after all 360 UK councils have uploaded their nightly XML files)
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Execute Full 363 Councils Data Sync
        run: npx tsx src/scripts/etl-sync-full.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
